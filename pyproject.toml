[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql"
version = "0.1.0"
description = "Production-grade LLM fine-tuning for Text-to-SQL generation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["nlp", "sql", "text2sql", "llm", "fine-tuning", "transformers"]

[project.urls]
Homepage = "https://github.com/yourusername/LLM-Finetuning"
Documentation = "https://github.com/yourusername/LLM-Finetuning/blob/main/docs"
Repository = "https://github.com/yourusername/LLM-Finetuning"
Issues = "https://github.com/yourusername/LLM-Finetuning/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  | .git
  | .venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src/text2sql --cov-report=html --cov-report=term"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
